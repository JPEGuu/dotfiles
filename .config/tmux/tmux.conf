# Transparency: No status bar and no prefix
set -g status off
set -g prefix None
unbind-key -a

# Sessions: Use Alt+d (Meta-d) to detach without prefix
bind-key -n M-d detach-client

# Mouse support for scrolling
set -g mouse on

# Neovim compatibility
set -s escape-time 0
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
