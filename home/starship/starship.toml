# Starship Configuration
# Inspired by Nerd Font Symbols preset: https://starship.rs/ja-JP/presets/nerd-font

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Clean and simple format (2 lines)
format = """
$directory$git_branch$git_status$c$cpp$golang$nodejs$python$rust$lua$nix_shell$conda$memory_usage$aws$gcloud$openstack$azure$env_var$crystal$custom$sudo$cmd_duration$jobs$battery$status$shell
$character"""

right_format = """$os$username$hostname$time"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
style = "bold blue"
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold magenta"

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[os]
disabled = false
style = "bold white"

[os.symbols]
Alpaquita = " "
Alpine = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = " "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
OpenBSD = " "
openSUSE = " "
OracleLinux = "󰆟 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
Redox = "󰀘 "
Solus = " "
SUSE = " "
Ubuntu = " "
Unknown = " "
Windows = "󰖳 "

[username]
style_user = "white bold"
style_root = "black bold"
format = "[$user]($style) "
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "on [$hostname](bold yellow) "
disabled = false

[aws]
symbol = "  "

[buf]
symbol = " "

[c]
symbol = " "
format = "via [$symbol($version )]($style)"

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fennel]
symbol = " "

[fossil_branch]
symbol = " "

[golang]
symbol = " "
format = "via [$symbol($version )]($style)"

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[hg_branch]
symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[kotlin]
symbol = " "

[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[meson]
symbol = "󰔷 "

[nim]
symbol = " "

[nix_shell]
symbol = " "

[nodejs]
symbol = " "
format = "via [$symbol($version )]($style)"

[ocaml]
symbol = " "

[package]
symbol = "󰏗 "

[pijul_channel]
symbol = " "

[python]
symbol = " "
format = "via [${symbol}${pyenv_prefix}(${version} )($virtualenv )]($style)"

[rlang]
symbol = "󰟔 "

[ruby]
symbol = " "

[rust]
symbol = " "
format = "via [$symbol($version )]($style)"

[scala]
symbol = " "

[swift]
symbol = " "

[zig]
symbol = " "

[cmd_duration]
min_time = 500
format = "took [$duration]($style) "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "

[[battery.display]]
threshold = 10
style = "bold red"

[time]
disabled = false
format = "at [$time]($style) "
time_format = "%Y/%m/%d %H:%M"
style = "bold gray"