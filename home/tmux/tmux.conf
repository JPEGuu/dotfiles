# --- Status Bar ---
# 見た目は binoymanoj/dotfiles の tmux.conf に寄せる（プラグイン非依存 / 生 conf のみ）。
# アイコン + │ セパレータのフラットなバー。配色は accent/inactive/text の 3 色。
#   accent(青紫)=#b4befe  inactive(グレー)=#6c7086  text=#cdd6f4
# prefix-less 運用のため prefix 表示は不要。左にセッション名 + copy/resize モード
# インジケータ、右に path(basename) / memory / date / time / host を出す。
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left-length 60
set -g status-right-length 120

# 左: セッション名 + モード表示（COPY = copy-mode, RESIZE = resize キーテーブル）
set -g status-left "#[fg=#b4befe,bold]  #S #{?pane_in_mode,#[fg=yellow][COPY] ,}#{?#{==:#{client_key_table},RESIZE},#[fg=#a6e3a1][RESIZE] ,}#[fg=#6c7086]│ "

# 右: カレントパス(フルパス) / 日付 / 時刻 / ホスト名
# すべて tmux ネイティブフォーマットで算出（#() フォーク無し = 毎秒 interval でも軽量）。
set -g status-right "\
#[fg=#b4befe] #[fg=#cdd6f4]#{pane_current_path} \
#[fg=#6c7086]│ #[fg=#b4befe] #[fg=#cdd6f4]%Y-%m-%d \
#[fg=#6c7086]│ #[fg=#b4befe] #[fg=#cdd6f4]%H:%M:%S \
#[fg=#6c7086]│ #[fg=#b4befe]󰒋 #[fg=#cdd6f4]#h "

# ウィンドウ一覧: 区切りなしで詰め、カレントを accent + bold で強調
set -g window-status-separator ""
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#b4befe,bold] #I:#W "

# 非アクティブペインは文字だけ grey に落として視認性を上げる。
# bg=default で端末の透過は維持（背景色は塗らない）。
# 注意: 自前で色指定するアプリ(vim/bat/ls の色付き等)の文字は tmux が上書きしないため dim されない。
set -g window-style "fg=#6c7086,bg=default"
set -g window-active-style "fg=#cdd6f4,bg=default"

# ペイン境界 / メッセージ / コピー選択の配色も同系にそろえる。
# アクティブ境界は accent で明確化（判別はタイトル帯が担うので線は細いまま）。
set -g pane-border-lines single
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#b4befe,bold"

# 各ペイン上端にタイトル帯。2分割時に「どっちが active か」を確実に判別できる。
# active 帯は ● + accent + bold、非 active は ○ + grey。
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#b4befe#,bold]● ,#[fg=#6c7086]○ }#{?pane_active,#[fg=#b4befe#,bold],#[fg=#6c7086]}#P:#{pane_current_command} "
set -g message-style "bg=default,fg=#cdd6f4,bold"
set -g message-command-style "bg=default,fg=#cdd6f4,bold"
set -g mode-style "bg=#b4befe,fg=#242933"

# --- Prefix & Detach ---
set -g prefix None
unbind-key -a
bind-key -n M-d detach-client

# --- Virtual Desktop-like Bindings (Alt + Key) ---
set -g base-index 1
setw -g pane-base-index 1

# --- Window ---
bind-key -n M-n new-window
bind-key -n M-q kill-window
bind-key -n 'M-[' previous-window
bind-key -n 'M-]' next-window

# ウィンドウ改名（現在名を初期値に）
bind-key -n 'M-,' command-prompt -I "#W" "rename-window -- '%%'"

# Alt + 1~9 to select windows
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# --- Session ---
# Alt+f で作業ディレクトリを選び、対応する tmux セッションへ切り替え/作成。
bind-key -n M-f display-popup -E "$HOME/.config/tmux/sessionizer.sh"
# セッション/ウィンドウ一覧（ツリー）。ここから選択して移動できる。
bind-key -n M-w choose-tree -Zs
# 前 / 次のセッションへ
bind-key -n 'M-(' switch-client -p
bind-key -n 'M-)' switch-client -n
# セッション改名（現在名を初期値に）
bind-key -n 'M-$' command-prompt -I "#S" "rename-session -- '%%'"

# --- Pane: Split ---
bind-key -n M-v split-window -h -c '#{pane_current_path}'
bind-key -n M-s split-window -v -c '#{pane_current_path}'

# --- Pane: Navigate ---
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# --- Pane: Swap (same window) ---
bind-key -n M-H swap-pane -t '{left-of}'
bind-key -n M-J swap-pane -t '{down-of}'
bind-key -n M-K swap-pane -t '{up-of}'
bind-key -n M-L swap-pane -t '{right-of}'

# --- Pane: Move (cross window) ---
bind-key -n 'M-{' join-pane -t :-1
bind-key -n 'M-}' join-pane -t :+1
bind-key -n M-! break-pane

# --- Pane: Resize (modal) ---
# 矢印は Windows Terminal の Alt+矢印(moveFocus)/Alt+Shift+矢印(resize) と衝突するため使わない。
# M-r で resize モードに入り、hjkl で連続調整、Esc/Enter/q で抜ける。
bind-key -n M-r switch-client -T RESIZE
bind-key -T RESIZE h resize-pane -L 3 \; switch-client -T RESIZE
bind-key -T RESIZE j resize-pane -D 3 \; switch-client -T RESIZE
bind-key -T RESIZE k resize-pane -U 3 \; switch-client -T RESIZE
bind-key -T RESIZE l resize-pane -R 3 \; switch-client -T RESIZE
bind-key -T RESIZE Escape switch-client -T root
bind-key -T RESIZE Enter  switch-client -T root
bind-key -T RESIZE q      switch-client -T root

# --- Pane: Other ---
bind-key -n M-x kill-pane
bind-key -n M-z resize-pane -Z

# --- Copy Mode (vi) ---
# M-c でコピーモードに入り、vi キーで選択・スクロール・検索。
bind-key -n M-c copy-mode
bind-key -T copy-mode-vi v      send-keys -X begin-selection
bind-key -T copy-mode-vi y      send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter  send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# --- Reload config ---
bind-key -n M-R source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux.conf reloaded"

# --- Mouse & Terminal ---
set -g mouse on
set -s escape-time 0
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on

# --- Clipboard (OSC 52) ---
# copy-mode の yank をターミナル経由でシステムクリップボードへ（clip.exe 等の外部依存なし）。
# external = tmux 自身のみクリップボードを設定でき、アプリからの OSC 52 は無視（安全側）。
# 貼り付け方向(OSC 52 read)は端末側が無効なのが通常。paste は WT の Ctrl+Shift+V / マウスで行う。
set -s set-clipboard external
set -as terminal-features ",tmux-256color:clipboard"

# --- QoL ---
setw -g mode-keys vi
set -g history-limit 50000     # スクロールバック拡張
set -g focus-events on         # nvim autoread 等の連携
set -g renumber-windows on     # ウィンドウを閉じたら番号を詰める
set -g display-time 1500       # ステータスメッセージ表示時間(ms)
