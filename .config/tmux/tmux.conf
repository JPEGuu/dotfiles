# --- Status Bar (Simple) ---
set -g status on
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left ""
set -g status-right "#[fg=white,bg=default]%H:%M "
setw -g window-status-current-style "fg=black,bg=white,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# --- Prefix & Detach ---
set -g prefix None
unbind-key -a
bind-key -n M-d detach-client

# --- Virtual Desktop-like Bindings (Alt + Key) ---
set -g base-index 1
setw -g pane-base-index 1

# --- Window ---
bind-key -n M-n new-window
bind-key -n M-q kill-window
bind-key -n 'M-[' previous-window
bind-key -n 'M-]' next-window

# Alt + 1~9 to select windows
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# --- Pane: Split ---
bind-key -n M-v split-window -h -c '#{pane_current_path}'
bind-key -n M-s split-window -v -c '#{pane_current_path}'

# --- Pane: Navigate ---
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# --- Pane: Swap (same window) ---
bind-key -n M-H swap-pane -t '{left-of}'
bind-key -n M-J swap-pane -t '{down-of}'
bind-key -n M-K swap-pane -t '{up-of}'
bind-key -n M-L swap-pane -t '{right-of}'

# --- Pane: Move (cross window) ---
bind-key -n 'M-{' join-pane -t :-1
bind-key -n 'M-}' join-pane -t :+1
bind-key -n M-! break-pane

# --- Pane: Resize ---
bind-key -n M-Up    resize-pane -U 2
bind-key -n M-Down  resize-pane -D 2
bind-key -n M-Left  resize-pane -L 2
bind-key -n M-Right resize-pane -R 2

# --- Pane: Other ---
bind-key -n M-x kill-pane
bind-key -n M-z resize-pane -Z

# --- Mouse & Terminal ---
set -g mouse on
set -s escape-time 0
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Auto Start Window 1 only ---
set-hook -g after-new-session {
    rename-window -t 1 nvim
    send-keys -t 1 "nvim" C-m
}
